server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # URLs limpias: /merge/privacy → merge/privacy.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache corto para CSS/imágenes con revalidación vía ETag. nginx
    # genera ETags automáticamente para ficheros estáticos; tras max-age
    # el navegador pide con If-None-Match y recibe 304 si nada cambió.
    # Evitamos `immutable` porque sin content-hashing en los nombres
    # cualquier deploy quedaría invisible hasta vaciar caché.
    location ~* \.(css|svg|png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
